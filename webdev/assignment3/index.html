<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <a href="#" class="timer-nav">Timer</a>
        </nav>
    </header>

    <main>
        <div class="apple-container" id="appleContainer">
            <img id="appleImg" src="apple.png" alt="Apple">
            <p id="timer">01:00</p>
        </div>

        <div class="buttons">
            <button id="startBtn" class="start">Start</button>
            <button id="pauseBtn" class="pause" disabled>Pause</button>
            <button id="stopBtn" class="stop" disabled>Stop</button>
        </div>
    </main>
    <footer>
        <p>© 2026 Mateo Inigo Lahera - CS230 Countdown Assignment</p>
    </footer>
</body>
</html>
